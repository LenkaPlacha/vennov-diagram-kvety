<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Triedenie kvetov</title>
  <link rel="stylesheet" href="./style.css">
</head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

  <h1>Triedenie kvetov do Vennovho diagramu</h1>
  <p>Lenka Plachá, Jana Jakubecová - 2.ročník, ext.</p>

  <div class="items">
    <div class="item flower blue four"
         draggable="true"
         id="flower1"></div>

    <div class="item flower blue five"
         draggable="true"
         id="flower2"></div>

    <div class="item flower green five"
         draggable="true"
         id="flower3"></div>

    <div class="item flower green four"
         draggable="true"
         id="flower4"></div>

    <div class="item flower mixed four"
         draggable="true"
         id="flower5"></div>

    <div class="item flower mixed four"
         draggable="true"
         id="flower6"></div>
  </div>


  <div class="venn">

    <div
      class="circle left"
      id="blueArea"
      ondrop="drop(event)"
      ondragover="allowDrop(event)"
    >
      <h3>Modré kvety</h3>
    </div>

    <div
      class="circle right"
      id="greenArea"
      ondrop="drop(event)"
      ondragover="allowDrop(event)"
    >
      <h3>Zelené kvety</h3>
    </div>

    <div
      class="intersection"
      id="bothArea"
      ondrop="drop(event)"
      ondragover="allowDrop(event)"
    >
      <span>Modré a zelené</span>
    </div>
  </div>
<div class="buttons">
  <button type="button" class="check-button" onclick="checkAnswer()">
    Skontrolovať
  </button>

  <button type="button" class="reset-button" onclick="resetGame()">
    Premiešať a resetovať
  </button>
</div>
<p id="result"></p>
<div id="celebration" aria-hidden="true"></div>
<div id="sad-face" aria-hidden="true">
  😢
</div>
  <script src="./script.js"></script>

</body>
</html>
